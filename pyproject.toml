[project]
name = "ml-engine"
version = "0.1.0"
description = "PyTorch Lightning framework that hopefully increases speed of implementing machine learning models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "pydantic>=2.5.0",
    "jaxtyping>=0.2.28",
    "typeguard>=4.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
